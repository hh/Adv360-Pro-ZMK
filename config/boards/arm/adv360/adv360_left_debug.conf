# Debug overlay for Adv360 - enables USB serial logging
# Include this with: west build ... -- -DEXTRA_CONF_FILE=adv360_left_debug.conf
# Or append to defconfig temporarily for debug builds

# USB CDC ACM logging
CONFIG_ZMK_USB_LOGGING=y

# Global log level - set to WARNING to reduce noise
CONFIG_LOG_DEFAULT_LEVEL=2

# ZMK core logging - WARNING only
CONFIG_ZMK_LOG_LEVEL_WRN=y

# BLE logging - WARNING only
CONFIG_BT_LOG_LEVEL_WRN=y
CONFIG_BT_GATT_LOG_LEVEL_WRN=y
CONFIG_BT_ATT_LOG_LEVEL_WRN=y

# Enable HOGP module for BLE trackpad support
# Set to INFO so we see connection messages
CONFIG_ZMK_HOGP=y
CONFIG_ZMK_HOGP_LOG_LEVEL_INF=y

# Mouse + iTrack support (dispatched by report length)
CONFIG_ZMK_HOGP_MOUSE_OUTPUT=y
CONFIG_ZMK_HOGP_MOUSE_SENSITIVITY=4
CONFIG_ZMK_HOGP_ITRACK_OUTPUT=y
CONFIG_ZMK_HOGP_MAX_DEVICES=2

# USB HID endpoint size - must be at least as large as our largest report
# Trackpad report is 24 bytes (Report ID 4), so we need at least 24
CONFIG_HID_INTERRUPT_EP_MPS=32

# Dual USB HID interfaces: HID_0 for keyboard/mouse, HID_1 for trackpad
# This allows hid-multitouch to bind to trackpad while hid-generic handles keyboard/mouse
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_USB_HID_TRACKPAD_INTERFACE=y

# Increase USB endpoint retry count to handle burst traffic
CONFIG_USB_NUMOF_EP_WRITE_RETRIES=20

# Enable serial commands (!pair, !hogp, !boot, etc.)
CONFIG_ZMK_SERIAL_CMD=y

# Required for HOGP: enable BLE Central role
CONFIG_BT_CENTRAL=y

# Enable automatic MTU exchange to get larger payloads from iTrack
# Without this, default MTU=23 limits reports to 20 bytes (truncated)
# With this, MTU negotiates higher allowing full 23-byte (5-finger) reports
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_L2CAP_TX_MTU=247

# Allow "Just Works" pairing for HOGP trackpad (ProtoArc uses unauthenticated pairing)
CONFIG_BT_SMP_ENFORCE_MITM=n

# Allow legacy pairing for older BLE HID devices (not just Secure Connections)
CONFIG_BT_SMP_SC_PAIR_ONLY=n

# Allow overwriting oldest bond when full (useful for HOGP testing)
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Auto-unpair conflicting bonds when re-pairing same device (fixes M720 re-pairing)
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y

# Increase max paired devices to accommodate HOGP trackpad
CONFIG_BT_MAX_PAIRED=7
