# Debug overlay for Adv360 - enables USB serial logging
# Include this with: west build ... -- -DEXTRA_CONF_FILE=adv360_left_debug.conf
# Or append to defconfig temporarily for debug builds

# USB CDC ACM logging
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# BLE debug logging (verbose - disable these if too noisy)
# CONFIG_BT_DEBUG_LOG=y  # Deprecated, use LOG instead
# CONFIG_BT_DEBUG_HCI_CORE=y
# CONFIG_BT_DEBUG_CONN=y
CONFIG_BT_GATT_LOG_LEVEL_DBG=y
CONFIG_BT_ATT_LOG_LEVEL_DBG=y

# Enable HOGP module for BLE trackpad support
CONFIG_ZMK_HOGP=y
CONFIG_ZMK_HOGP_LOG_LEVEL_DBG=y

# Phase 2A: Forward trackpad as mouse movement
CONFIG_ZMK_HOGP_MOUSE_OUTPUT=y
CONFIG_ZMK_HOGP_MOUSE_SENSITIVITY=4

# Enable serial commands (!pair, !hogp, !boot, etc.)
CONFIG_ZMK_SERIAL_CMD=y

# Required for HOGP: enable BLE Central role
CONFIG_BT_CENTRAL=y

# Allow "Just Works" pairing for HOGP trackpad (ProtoArc uses unauthenticated pairing)
CONFIG_BT_SMP_ENFORCE_MITM=n

# Allow legacy pairing for older BLE HID devices (not just Secure Connections)
CONFIG_BT_SMP_SC_PAIR_ONLY=n

# Allow overwriting oldest bond when full (useful for HOGP testing)
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Auto-unpair conflicting bonds when re-pairing same device (fixes M720 re-pairing)
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y

# Increase max paired devices to accommodate HOGP trackpad
CONFIG_BT_MAX_PAIRED=7
